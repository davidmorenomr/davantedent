<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DavanteDent - Citas</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header>
    <img src="img/logo.svg" alt="Logo DavanteDent">
    <h1>Gestión de citas</h1>
  </header>

  <main>
    <form id="formCita" novalidate>
      <input type="hidden" id="idCita">

      <fieldset>
        <legend>Fecha de la cita</legend>
        <div class="fila">
          <input type="number" id="dia"    placeholder="Día">
          <input type="number" id="mes"    placeholder="Mes">
          <input type="number" id="anio"   placeholder="Año">
          <input type="number" id="hora"   placeholder="Hora">
          <input type="number" id="minuto" placeholder="Minuto">
        </div>
        <span class="error" id="error-fecha"></span>
      </fieldset>

      <fieldset>
        <legend>Paciente</legend>
        <div class="fila">
          <div class="campo">
            <input type="text" id="nombre" placeholder="Nombre">
            <span class="error" id="error-nombre"></span>
          </div>
          <div class="campo">
            <input type="text" id="apellidos" placeholder="Apellidos">
            <span class="error" id="error-apellidos"></span>
          </div>
          <div class="campo">
            <input type="text" id="dni" placeholder="DNI">
            <span class="error" id="error-dni"></span>
          </div>
          <div class="campo">
            <input type="text" id="telefono" placeholder="Teléfono">
            <span class="error" id="error-telefono"></span>
          </div>
          <div class="campo">
            <input type="date" id="nacimiento">
            <span class="error" id="error-nacimiento"></span>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Observaciones</legend>
        <textarea id="observaciones" placeholder="Observaciones (máx. 100 caracteres)"></textarea>
        <span class="error" id="error-observaciones"></span>
      </fieldset>

      <button type="submit" id="btnGuardar">Guardar cita</button>
    </form>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>Nº</th>
            <th>Fecha</th>
            <th>Paciente</th>
            <th>DNI</th>
            <th>Teléfono</th>
            <th>Nacimiento</th>
            <th>Observaciones</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbodyCitas"></tbody>
      </table>
    </div>
  </main>

  <footer>
    DavanteDent · Calle Ejemplo 1 · Tel. 900 000 000 · info@davantedent.es
  </footer>

  <script src="js/cita.js"></script>
  <script src="js/cookies.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
